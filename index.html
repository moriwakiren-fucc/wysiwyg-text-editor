<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WYSIWYGエディタ</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#1f2328;--muted:#656d76;--border:#d0d7de;--accent:#2563eb;--btn:#f3f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--surface:#1e2125;--text:#e6e8eb;--muted:#9aa3ad;--border:#363b42;--accent:#6ea0ff;--btn:#2a2e33}}
:root[data-theme="dark"]{--bg:#15171a;--surface:#1e2125;--text:#e6e8eb;--muted:#9aa3ad;--border:#363b42;--accent:#6ea0ff;--btn:#2a2e33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px}
.toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 2px}
button,select{font:inherit;font-size:14px;color:var(--text);background:var(--btn);border:1px solid var(--border);border-radius:6px;padding:4px 10px;min-height:32px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.dbl{text-decoration:underline double}
label.clr{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
input[type=color]{width:32px;height:32px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer}
#editor{min-height:220px;padding:12px;border:1px solid var(--border);border-radius:6px;outline:none;background:#fff;color:#111;font-size:16px;overflow-wrap:anywhere}
#editor:focus{border-color:var(--accent)}
#editor img{max-width:100%;height:auto}
#editor blockquote{border-left:4px solid #bbb;padding:.5em 1em;color:#555}
#editor table{border-collapse:collapse;width:100%}
#editor td,#editor th{border:1px solid #999;padding:6px 8px;min-width:40px}
#editor a{color:#1d4ed8}
#editor:empty::before{content:"ここに入力してください…";color:#999}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.frame-wrap{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;display:flex;justify-content:center}
iframe{border:1px solid var(--border);background:#fff;height:auto;aspect-ratio:16/9;width:100%;max-width:100%;display:block}
iframe.sp{width:360px;aspect-ratio:9/16}
[hidden]{display:none!important}
.panel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:13px}
.panel input[type=text],.panel input[type=number]{font:inherit;font-size:14px;padding:4px 8px;min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.panel input[type=text]{flex:1;min-width:180px}
.panel input[type=number]{width:60px}
pre{margin:0;padding:12px;background:#0f1216;color:#d6e2f0;border-radius:6px;overflow:auto;max-height:340px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.copyrow{display:flex;justify-content:flex-end;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>WYSIWYGテキストエディタ</h1>

<section>
  <h2>エディタ</h2>
  <div class="toolbar" id="toolbar">
    <button data-cmd="undo" title="取り消す">〈取り消す</button>
    <button data-cmd="redo" title="やり直す">やり直す〉</button>
    <span class="sep"></span>
    <select id="size" title="フォントサイズ">
      <option value="">サイズ</option>
      <option>12</option><option>14</option><option>16</option><option>18</option>
      <option>24</option><option>32</option><option>40</option><option>48</option>
    </select>
    <span class="sep"></span>
    <button data-cmd="bold" title="太字"><b>B</b></button>
    <button data-cmd="italic" title="斜体"><i>I</i></button>
    <button data-cmd="underline" title="下線"><u>U</u></button>
    <button id="dbl" title="二重下線"><span class="dbl">U</span></button>
    <span class="sep"></span>
    <label class="clr">文字色<input type="color" id="fore" value="#d32f2f"></label>
    <label class="clr">マーカー<input type="color" id="back" value="#fff176"></label>
    <button id="clearback" title="マーカー解除">解除</button>
    <span class="sep"></span>
    <button data-cmd="justifyLeft" title="左揃え">左</button>
    <button data-cmd="justifyCenter" title="中央揃え">中央</button>
    <button data-cmd="justifyRight" title="右揃え">右</button>
    <span class="sep"></span>
    <button id="imgbtn">画像挿入</button>
    <span class="sep"></span>
    <button data-cmd="outdent" title="インデントを戻す">◀インデント</button>
    <button data-cmd="indent" title="インデントを増やす">インデント▶</button>
    <button id="quote" title="引用">❝ 引用</button>
    <button id="linkbtn" title="リンク">🔗 リンク</button>
    <button id="tblbtn" title="表">▦ 表</button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="panel" id="linkPanel" hidden>
    <span>URL</span><input type="text" id="url" placeholder="https://">
    <button id="linkApply">適用</button><button id="linkRemove">リンク解除</button>
  </div>
  <div class="panel" id="tblPanel" hidden>
    <span>行</span><input type="number" id="rows" value="3" min="1" max="20">
    <span>列</span><input type="number" id="cols" value="3" min="1" max="10">
    <button id="tblIns">表を挿入</button>
    <span class="sep"></span>
    <button id="rowAdd">行追加</button><button id="colAdd">列追加</button>
    <button id="rowDel">行削除</button><button id="colDel">列削除</button><button id="tblDel">表削除</button>
  </div>
  <div id="editor" contenteditable="true" spellcheck="false"></div>
  <p class="hint">画像はブロック（単独の行）として挿入されます。画像を選択して左・中央・右ボタンで配置を変えられます。</p>
</section>

<section id="previewSec" hidden>
  <h2>プレビュー</h2>
  <div class="tabs">
    <button id="pc" class="on">PCレイアウト</button>
    <button id="sp">スマホレイアウト</button>
  </div>
  <div class="frame-wrap"><iframe id="frame" title="preview"></iframe></div>
</section>

<section id="codeSec" hidden>
  <h2>HTMLコード</h2>
  <div class="copyrow"><button id="copy">コードをコピー</button></div>
  <pre id="code"></pre>
</section>
</main>

<script>
(function(){
  var ed=document.getElementById('editor'), saved=null;
  var $=function(id){return document.getElementById(id)};

  document.addEventListener('selectionchange',function(){
    var s=getSelection();
    if(s.rangeCount&&ed.contains(s.anchorNode)) saved=s.getRangeAt(0).cloneRange();
  });
  function restore(){
    ed.focus();
    if(saved){var s=getSelection();s.removeAllRanges();s.addRange(saved)}
  }
  function exec(c,v){restore();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v||null);update()}

  // toolbar buttons keep editor selection
  document.querySelectorAll('#toolbar button,.panel button').forEach(function(b){
    b.addEventListener('mousedown',function(e){e.preventDefault()});
  });
  document.querySelectorAll('[data-cmd]').forEach(function(b){
    b.addEventListener('click',function(){exec(b.dataset.cmd);refreshState()});
  });

  // font size
  $('size').addEventListener('change',function(){
    var px=this.value; if(!px) return;
    exec('fontSize','7');
    ed.querySelectorAll('span,font').forEach(function(n){
      if(n.style&&n.style.fontSize==='xxx-large') n.style.fontSize=px+'px';
      else if(n.tagName==='FONT'&&n.getAttribute('size')==='7'){n.removeAttribute('size');n.style.fontSize=px+'px'}
    });
    this.value=''; update();
  });

  // colors
  $('fore').addEventListener('input',function(){exec('foreColor',this.value)});
  $('back').addEventListener('input',function(){exec('hiliteColor',this.value)});
  $('clearback').addEventListener('click',function(){exec('hiliteColor','transparent')});

  // double underline (toggle)
  $('dbl').addEventListener('click',function(){
    restore();
    var s=getSelection(); if(!s.rangeCount) return;
    var r=s.getRangeAt(0);
    var n=r.commonAncestorContainer; if(n.nodeType===3) n=n.parentNode;
    var ex=n.closest&&n.closest('span[data-dbl]');
    if(ex&&ed.contains(ex)){
      while(ex.firstChild) ex.parentNode.insertBefore(ex.firstChild,ex);
      ex.remove();
    }else if(!r.collapsed){
      var sp=document.createElement('span');
      sp.setAttribute('data-dbl','1');
      sp.style.textDecoration='underline double';
      sp.appendChild(r.extractContents());
      r.insertNode(sp);
      s.removeAllRanges();var nr=document.createRange();nr.selectNodeContents(sp);s.addRange(nr);
    }
    update();
  });

  // image (block)
  $('imgbtn').addEventListener('click',function(){$('file').click()});
  $('file').addEventListener('change',function(){
    var f=this.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      restore();
      var html='<div style="text-align:left"><img src="'+fr.result+'" data-filename="'+f.name.replace(/"/g,'&quot;')+'" alt="" style="max-width:100%;height:auto"></div><p><br></p>';
      document.execCommand('insertHTML',false,html);
      update();
    };
    fr.readAsDataURL(f); this.value='';
  });

  function refreshState(){
    ['bold','italic','underline'].forEach(function(c){
      var b=document.querySelector('[data-cmd="'+c+'"]');
      try{b.classList.toggle('on',document.queryCommandState(c))}catch(e){}
    });
    ['justifyLeft','justifyCenter','justifyRight'].forEach(function(c){
      var b=document.querySelector('[data-cmd="'+c+'"]');
      try{b.classList.toggle('on',document.queryCommandState(c))}catch(e){}
    });
  }
  document.addEventListener('selectionchange',function(){if(saved)refreshState()});

  // output
  // quote
  $('quote').addEventListener('click',function(){
    restore();
    var v=document.queryCommandValue('formatBlock');
    exec('formatBlock',v==='blockquote'?'p':'blockquote');
  });

  // link
  var editingLink=null;
  function curEl(sel){var n=sel.anchorNode;if(n&&n.nodeType===3)n=n.parentNode;return n}
  $('linkbtn').addEventListener('click',function(){
    restore();
    var p=$('linkPanel'), s=getSelection(), el=s.rangeCount?curEl(s):null;
    editingLink=(el&&el.closest&&el.closest('a')&&ed.contains(el))?el.closest('a'):null;
    $('url').value=editingLink?editingLink.getAttribute('href'):'https://';
    p.hidden=!p.hidden;
    if(!p.hidden)$('url').focus();
  });
  $('linkApply').addEventListener('click',function(){
    var v=$('url').value.trim(); if(!v) return;
    restore();
    var s=getSelection();
    if(editingLink){editingLink.setAttribute('href',v)}
    else if(s.rangeCount&&s.getRangeAt(0).collapsed){
      document.execCommand('insertHTML',false,'<a href="'+v.replace(/"/g,'&quot;')+'">'+v.replace(/</g,'&lt;')+'</a>');
    }else document.execCommand('createLink',false,v);
    $('linkPanel').hidden=true; update();
  });
  $('linkRemove').addEventListener('click',function(){
    restore();
    if(editingLink){var a=editingLink;while(a.firstChild)a.parentNode.insertBefore(a.firstChild,a);a.remove()}
    else document.execCommand('unlink');
    $('linkPanel').hidden=true; update();
  });

  // table
  $('tblbtn').addEventListener('click',function(){var p=$('tblPanel');p.hidden=!p.hidden});
  function cell(){
    restore();var s=getSelection();if(!s.rangeCount)return null;
    var el=curEl(s),c=el&&el.closest?el.closest('td,th'):null;
    return c&&ed.contains(c)?c:null;
  }
  $('tblIns').addEventListener('click',function(){
    var r=Math.max(1,Math.min(20,+$('rows').value||3)),c=Math.max(1,Math.min(10,+$('cols').value||3));
    var h='<table><tbody>';
    for(var i=0;i<r;i++){h+='<tr>';for(var j=0;j<c;j++)h+='<td><br></td>';h+='</tr>'}
    h+='</tbody></table><p><br></p>';
    restore();document.execCommand('insertHTML',false,h);update();
  });
  function newCells(tr,idx,th){var e=document.createElement(th||'td');e.innerHTML='<br>';var ref=tr.cells[idx];tr.insertBefore(e,ref?ref.nextSibling:null)}
  $('rowAdd').addEventListener('click',function(){
    var c=cell();if(!c)return;var tr=c.parentNode,n=document.createElement('tr');
    for(var i=0;i<tr.cells.length;i++){var e=document.createElement('td');e.innerHTML='<br>';n.appendChild(e)}
    tr.parentNode.insertBefore(n,tr.nextSibling);update();
  });
  $('colAdd').addEventListener('click',function(){
    var c=cell();if(!c)return;var i=c.cellIndex,t=c.closest('table');
    Array.prototype.forEach.call(t.rows,function(tr){newCells(tr,i)});update();
  });
  $('rowDel').addEventListener('click',function(){
    var c=cell();if(!c)return;var t=c.closest('table');
    if(t.rows.length<=1)t.remove();else c.parentNode.remove();update();
  });
  $('colDel').addEventListener('click',function(){
    var c=cell();if(!c)return;var i=c.cellIndex,t=c.closest('table');
    if(c.parentNode.cells.length<=1){t.remove()}
    else Array.prototype.forEach.call(t.rows,function(tr){if(tr.cells[i])tr.deleteCell(i)});update();
  });
  $('tblDel').addEventListener('click',function(){
    var c=cell();if(!c)return;c.closest('table').remove();update();
  });

  function cleanHTML(forCode){
    var c=ed.cloneNode(true);
    c.querySelectorAll('blockquote').forEach(function(q){q.style.borderLeft='4px solid #bbb';q.style.padding='.5em 1em';q.style.color='#555'});
    c.querySelectorAll('table').forEach(function(t){t.style.borderCollapse='collapse';t.style.width='100%'});
    c.querySelectorAll('td,th').forEach(function(d){d.style.border='1px solid #999';d.style.padding='6px 8px'});
    if(forCode)c.querySelectorAll('img').forEach(function(i){i.setAttribute('src',i.getAttribute('data-filename')||'');i.removeAttribute('data-filename')});
    c.querySelectorAll('[data-dbl]').forEach(function(n){n.removeAttribute('data-dbl')});
    return c.innerHTML.replace(/<p><br><\/p>$/,'').replace(/<div><br><\/div>/g,'<br>');
  }
  function pretty(h){
    return h.replace(/(<\/(div|p|h\d|ul|ol|li|tr|table|blockquote)>)/g,'$1\n').replace(/<br>(?!\n)/g,'<br>\n').trim();
  }
  function update(){
    var has=ed.textContent.trim()!==''||ed.querySelector('img');
    $('previewSec').hidden=!has; $('codeSec').hidden=!has;
    if(!has) return;
    var h=cleanHTML(false);
    $('frame').srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:16px;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7;color:#111;overflow-wrap:anywhere}img{max-width:100%;height:auto}</style></head><body>'+h+'</body></html>';
    $('code').textContent=pretty(cleanHTML(true));
  }
  ed.addEventListener('input',update);

  $('pc').addEventListener('click',function(){$('frame').className='';$('pc').classList.add('on');$('sp').classList.remove('on')});
  $('sp').addEventListener('click',function(){$('frame').className='sp';$('sp').classList.add('on');$('pc').classList.remove('on')});

  $('copy').addEventListener('click',function(){
    var t=$('code').textContent, b=this;
    function done(){b.textContent='コピーしました ✓';setTimeout(function(){b.textContent='コードをコピー'},1500)}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done()}catch(e){}ta.remove();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,fallback); else fallback();
  });
})();
</script>
</body>
</html>
